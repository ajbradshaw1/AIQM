name: tests

# Hardware probes stay in scripts/. pytest.ini restricts collection to offline
# tests under tests/ and tools/rheed_postprocessing_labeling/tests/.
#
# This work is published to codex/gui-brightness-robust-four-output-shadow
# without a PR, so `main`-only triggers would leave it untested. The branch is
# listed explicitly, and workflow_dispatch allows a re-run against any commit
# already on a remote branch.
on:
  push:
    branches:
      - main
      - codex/gui-brightness-robust-four-output-shadow
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  headless-suite:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 \
            libdbus-1-3 libxcb-cursor0

      # torch/torchvision FIRST, from the CPU-only index.
      #
      # timm pulls torch transitively, and pip's default index serves the CUDA
      # build on Linux — so CI was downloading a multi-gigabyte GPU runtime for
      # a suite that never touches a GPU. `--extra-index-url` does NOT fix this:
      # it only adds an index, leaving pip free to resolve the CUDA wheel from
      # PyPI anyway. `--index-url` replaces the index outright, which is the
      # only reliable way to guarantee the CPU build.
      #
      # Installing these before requirements.txt means the timm dependency is
      # already satisfied when pip resolves the rest, so nothing re-downloads.
      #
      # Pinned to the versions exercised locally (torch 2.13.0). Both wheels
      # exist for cp313 on manylinux_2_28_x86_64 and win_amd64, so CI and the
      # Bulbasaur production environment can pin identically.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0+cpu torchvision==0.28.0+cpu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run headless pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
