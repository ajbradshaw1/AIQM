name: tests

# Hardware probes stay in scripts/. pytest.ini restricts automated collection
# to offline tests under tests/ so CI never opens cameras or instrument links.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  headless-suite:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libegl1 libgl1 libglib2.0-0 \
            libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run headless pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
